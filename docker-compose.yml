# Local / demo stack: the service, PostgreSQL and Mailpit (a fake SMTP server with a web inbox).
#
#   docker compose up --build
#
#   API + Swagger UI : http://localhost:8080/swagger-ui.html
#   Mail inbox       : http://localhost:8025
#
# The logistics example domain is mounted; point APP_DOMAIN_CONFIG at your own file to change it.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: usermanagement
      POSTGRES_USER: usermanagement
      POSTGRES_PASSWORD: ${DB_PASSWORD:-usermanagement}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usermanagement -d usermanagement"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  user-management:
    build: .
    image: user-management-service:latest
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/usermanagement
      DB_USERNAME: usermanagement
      DB_PASSWORD: ${DB_PASSWORD:-usermanagement}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      MAIL_FROM: no-reply@acme-logistics.local
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin-Passw0rd}
      APP_DOMAIN_CONFIG: /config/domain.yml
      # For real deployments, provide a key pair (see scripts/generate-jwt-keys.sh) and use the prod profile:
      # SPRING_PROFILES_ACTIVE: prod
      # JWT_PRIVATE_KEY: file:/run/secrets/jwt-private.pem
      # JWT_PUBLIC_KEY: file:/run/secrets/jwt-public.pem
    volumes:
      - ./config/examples/logistics.yml:/config/domain.yml:ro

volumes:
  postgres-data:
